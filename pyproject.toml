[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.0.1"
description = "RAG over RBI Master Directions with citations"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dense = ["numpy>=1.24", "sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
