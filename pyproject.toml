[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "RAG over RBI Master Directions with citations"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["openai>=1.30"]
dense = ["numpy>=1.24", "sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.24", "fastapi>=0.110", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reglens = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
