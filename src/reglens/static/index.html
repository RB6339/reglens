<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegLens</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: .2rem; }
  .sub { color: #666; margin-top: 0; }
  form { display: flex; gap: .5rem; margin: 1.2rem 0; }
  input { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: .6rem 1rem; font-size: 1rem; border: 0; border-radius: 6px; background: #1c3a5e; color: #fff; cursor: pointer; }
  button.alt { background: #e6ebf1; color: #1c3a5e; }
  .answer { background: #f3f6fa; border-left: 4px solid #1c3a5e; padding: .8rem 1rem; white-space: pre-wrap; }
  .hit { border-bottom: 1px solid #eee; padding: .8rem 0; }
  .cite { font-weight: 600; color: #1c3a5e; }
  .muted { color: #777; font-size: .9rem; }
</style>
</head>
<body>
<h1>RegLens</h1>
<p class="sub">Ask about RBI Master Directions. Every answer points to the paragraph it came from.</p>
<form id="f">
  <input id="q" placeholder="e.g. How often should KYC be updated for high risk customers?" required>
  <button type="submit" data-mode="ask">Ask</button>
  <button type="submit" data-mode="search" class="alt">Search</button>
</form>
<div id="out"></div>
<script>
const out = document.getElementById("out");
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mode = e.submitter.dataset.mode, q = document.getElementById("q").value;
  out.innerHTML = '<p class="muted">Working...</p>';
  const body = mode === "ask" ? {question: q} : {query: q, k: 5};
  const r = await fetch("/" + mode, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) { out.innerHTML = `<p>${esc(data.detail || "Error")}</p>`; return; }
  if (mode === "ask") {
    const cites = data.citations.map(c => `<div class="muted">[${c.n}] ${esc(c.citation)}</div>`).join("");
    out.innerHTML = `<div class="answer">${esc(data.answer)}</div>${cites}`;
  } else {
    out.innerHTML = data.results.map(h =>
      `<div class="hit"><div class="cite">${esc(h.citation)}</div><div class="muted">${esc(h.chapter)}</div>` +
      `<div>${esc(h.text.slice(0, 400))}...</div></div>`).join("") || "<p>No matching paragraphs.</p>";
  }
});
</script>
</body>
</html>
